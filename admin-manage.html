<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Курси · Адмін-панель</title>
<link rel="stylesheet" href="css/style.css?v=20260808-2" />
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="admin-brand" href="admin-manage.html"><span>AK</span><strong>ADMIN</strong></a>
    <nav class="admin-nav" aria-label="Адмін-навігація">
      <a class="active" href="admin-manage.html"><span aria-hidden="true">▣</span>Курси</a>
      <a href="admin-manage-students.html"><span aria-hidden="true">♙</span>Учениці</a>
      <a href="admin.html"><span aria-hidden="true">◌</span>Повідомлення</a>
    </nav>
    <button id="logout-btn" class="admin-logout" type="button">↪ <span>Вийти з акаунта</span></button>
  </aside>

  <main class="admin-main">
    <header class="admin-page-header">
      <div>
        <p class="admin-eyebrow">Навчальна платформа</p>
        <h1>Курси</h1>
        <p>Створюйте програми та керуйте структурою уроків.</p>
      </div>
      <button id="add-course" class="admin-primary" type="button">＋ Новий курс</button>
    </header>

    <section class="admin-toolbar" aria-label="Пошук курсів">
      <label class="admin-search"><span>⌕</span><input id="course-search" type="search" placeholder="Пошук курсів" /></label>
      <span id="course-count" class="admin-count"></span>
    </section>

    <p id="course-error" class="admin-alert error" hidden></p>
    <section id="course-list" class="admin-course-grid" aria-live="polite"></section>
  </main>
</div>
<script type="module" src="js/pages/admin-manage.js?v=20260808-2"></script>
</body>
</html>
