<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Редагування курсу · Адмін-панель</title>
<link rel="stylesheet" href="css/style.css?v=20261113-4" />
</head>
<body class="admin-body admin-editor-body">
<div class="admin-shell" id="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand-row">
      <a class="admin-brand" href="admin-manage.html"><strong>BRWI.</strong></a>
      <button id="toggle-sidebar" class="admin-sidebar-toggle" type="button" aria-label="Згорнути головне меню" title="Згорнути меню">☰</button>
    </div>
    <nav class="admin-nav" aria-label="Адмін-навігація">
      <a class="active" href="admin-manage.html"><span aria-hidden="true">▣</span><b>Курси</b></a>
      <a href="admin-manage-students.html"><span aria-hidden="true">♙</span><b>Учениці</b></a>
      <a href="admin-review.html"><span aria-hidden="true">🔓</span>Перевірка ДЗ</a>
      <a href="admin.html"><span aria-hidden="true">◌</span><b>Повідомлення</b></a>
    </nav>
    <button id="logout-btn" class="admin-logout" type="button">↪ <span>Вийти з акаунта</span></button>
  </aside>

  <main class="admin-main admin-editor-main">
    <header class="admin-compact-header">
      <div class="admin-course-path">
        <a href="admin-manage.html">Курси</a><span>/</span>
        <input id="course-short-label" type="text" maxlength="32" placeholder="Мітка" aria-label="Мітка курсу" title="Мітка курсу" />
        <input id="course-title" type="text" aria-label="Назва курсу" />
        <button id="choose-course-presentation" class="admin-presentation-button" type="button" aria-label="Загальна презентація курсу" title="Загальна презентація курсу">📁</button>
        <button id="delete-course" class="admin-presentation-button danger" type="button" aria-label="Видалити курс" title="Видалити курс">🗑</button>
        <span id="course-presentation-file-name" class="admin-file-name" hidden></span>
      </div>
      <div class="admin-view-switch" aria-label="Режим редактора">
        <button id="single-mode" class="active" type="button">Один урок</button>
        <button id="table-mode" type="button">Картки курсу</button>
      </div>
      <div class="admin-header-actions">
        <a id="preview-course" class="admin-secondary disabled" href="#" aria-disabled="true">◉ Переглянути як учениця</a>
      </div>
    </header>

    <section id="single-view" class="admin-editor-layout">
      <aside class="admin-lessons-panel">
        <div class="admin-section-title"><h2>Уроки</h2><span id="lessons-count"></span></div>
        <label class="admin-search compact"><span>⌕</span><input id="lesson-search" type="search" placeholder="Пошук уроків" /></label>
        <div id="lessons-list" class="admin-lesson-list"></div>
        <button id="add-lesson" class="admin-dashed" type="button">＋ Додати урок</button>
      </aside>

      <section id="lesson-editor" class="admin-lesson-editor" aria-live="polite">
        <div id="editor-empty" class="admin-empty-state">
          <span>▤</span><h2>Оберіть урок</h2>
        </div>
        <div id="editor-content" hidden>
          <div class="admin-lesson-editor-title">
            <input id="lesson-short-label" type="text" class="lesson-inline-label" placeholder="Мітка" aria-label="Мітка" />
            <input id="lesson-title" type="text" class="lesson-inline-title" placeholder="Назва уроку" aria-label="Назва уроку" />
          </div>

          <section class="admin-panel admin-primary-fields">
            <textarea id="lesson-description" rows="6" placeholder="Опис уроку" aria-label="Опис уроку"></textarea>
          </section>

          <div class="admin-lesson-data-grid admin-single-sections">
            <section class="admin-panel admin-materials-panel">
              <h3>Матеріали</h3>
              <div id="video-list" class="admin-video-list"></div>
              <div class="admin-add-row">
                <input id="new-material" type="text" placeholder="Посилання на відео або презентацію, потім Enter" />
                <button id="add-material-file" class="admin-secondary admin-upload-icon" type="button" title="Прикріпити файл">📁</button>
              </div>
            </section>

            <section class="admin-panel admin-homework-access-panel">
              <div class="admin-homework-column">
              <div class="admin-toggle-row">
                <div><h3>Домашнє завдання</h3></div>
                <label class="admin-switch"><input id="homework-enabled" type="checkbox" /><span></span></label>
              </div>
              <div id="homework-settings">
                  <fieldset class="admin-homework-formats">
                    <label><input id="homework-require-text" type="checkbox" /> Текст</label>
                    <label><input id="homework-require-photo" type="checkbox" /> Фото</label>
                    <label><input id="homework-require-video" type="checkbox" /> Відео</label>
                  </fieldset>
                <textarea id="homework-description" class="admin-field" rows="6" placeholder="Завдання: опишіть, що потрібно виконати" aria-label="Завдання"></textarea>
              </div>
            </div>
            <div class="admin-access-column">
              <select id="access-rule" aria-label="Умова доступу до наступного уроку">
                <option value="free">Вільний доступ</option>
                <option value="after_submission">Після здачі ДЗ</option>
                <option value="after_review">Після перевірки ДЗ</option>
                <option value="after_delay">Через час</option>
                <option value="scheduled">За графіком</option>
              </select>
              <div id="access-delay-settings" class="admin-access-timing" hidden>
                <label>Через годин<input id="access-delay-hours" type="number" min="1" max="8760" step="1" /></label>
              </div>
              <div id="access-schedule-settings" class="admin-access-timing" hidden>
                <label>Через днів<input id="access-delay-days" type="number" min="1" max="365" step="1" /></label>
                <label>О котрій<input id="access-unlock-time" type="time" /></label>
              </div>
            </div>
            </section>
          </div>

          <section class="admin-panel admin-lesson-footer">
            <select id="lesson-parent" aria-label="Рівень уроку"><option value="">Головний рівень</option></select>
            <button id="delete-lesson" class="admin-danger-link" type="button">Видалити урок</button>
          </section>
        </div>
      </section>
    </section>

    <section id="table-view" class="admin-comparison-view" hidden>
      <div class="admin-comparison-toolbar">
        <button id="add-lesson-table" class="admin-primary" type="button">＋ Додати урок</button>
      </div>
      <div id="comparison-body" class="admin-comparison-card-list"></div>
    </section>

    <p id="editor-error" class="admin-alert error" hidden></p>
  </main>
</div>

<input id="course-asset-file" type="file" hidden />

<script type="module" src="js/pages/admin-manage-course.js?v=20261113-4"></script>
</body>
</html>
