<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Курс</title>
<link rel="stylesheet" href="css/style.css?v=20261112-3" />
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="icon-btn" href="#" id="back-link">←</a>
    <div style="flex:1;min-width:0;">
      <p class="title" id="course-title"></p>
      <p class="subtitle" id="student-context" style="display:none;"></p>
    </div>
  </div>

  <div id="presentation-block" class="material-row" hidden>
    <a id="presentation-link" class="material-link" target="_blank" rel="noreferrer">Презентація курсу</a>
    <button id="presentation-download" class="icon-btn" type="button" title="Завантажити" hidden>↓</button>
  </div>

  <div class="lesson-strip" id="lesson-strip"></div>

  <div class="video-box" id="video-box"></div>
  <div class="video-selector" id="video-selector" hidden></div>

  <div id="lesson-presentation-block" class="material-row" style="margin-top:14px;" hidden>
    <a id="lesson-presentation-link" class="material-link" target="_blank" rel="noreferrer">Презентація уроку</a>
    <button id="lesson-presentation-download" class="icon-btn" type="button" title="Завантажити" hidden>↓</button>
  </div>

  <div style="margin-top:16px;">
    <details class="section-card" id="description-block" open hidden>
      <summary>Опис уроку</summary>
      <div class="section-body text" id="lesson-description"></div>
    </details>

    <details class="section-card" id="homework-block" open hidden>
      <summary>Домашнє завдання</summary>
      <div class="section-body" id="homework-container"></div>
    </details>

    <section class="section-card">
      <div class="section-head">Чат</div>
      <div class="section-body" id="chat-container"></div>
    </section>
  </div>
</div>

<script type="module" src="js/pages/course.js?v=20261112-3"></script>
</body>
</html>
