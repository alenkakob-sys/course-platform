<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Учениці · Адмін-панель</title>
<link rel="stylesheet" href="css/style.css?v=20261112-1" />
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="admin-brand" href="admin-manage.html"><strong>BRWI.</strong></a>
    <nav class="admin-nav" aria-label="Адмін-навігація">
      <a href="admin-manage.html"><span aria-hidden="true">▣</span>Курси</a>
      <a class="active" href="admin-manage-students.html"><span aria-hidden="true">♙</span>Учениці</a>
      <a href="admin.html"><span aria-hidden="true">◌</span>Повідомлення</a>
    </nav>
    <button id="logout-btn" class="admin-logout" type="button">↪ <span>Вийти з акаунта</span></button>
  </aside>

  <main class="admin-main">
    <header class="admin-page-header">
      <div>
        <p class="admin-eyebrow">Керування доступом</p>
        <h1>Учениці</h1>
        <p>Надавайте доступ до окремих курсів.</p>
      </div>
    </header>

    <section class="admin-panel admin-invite-panel">
      <div>
        <h2>Додати ученицю</h2>
        <p>Лист не надсилається. Доступ з’явиться після її першого входу через Google.</p>
      </div>
      <!-- Браузер підставляє твою пошту не через <form>, а за НАЗВОЮ поля: він
           бачить слово email в id/name і вирішує, що це «моя пошта». Тому поле
           більше ніде не зветься email, значення autocomplete навмисно
           невідоме браузеру, а до першого дотику поле readonly — у readonly
           Chrome не підставляє нічого взагалі. -->
      <div id="invite-form">
        <input id="invite-target" type="text" readonly placeholder="вписати пошту учениці"
               name="brwi-access-row" autocomplete="brwi-no-autofill" autocapitalize="off"
               spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other"
               aria-label="Пошта учениці" />
        <div id="pending-course-options" class="admin-access-list"></div>
        <button id="invite-submit" type="button" class="admin-primary">Зберегти доступ</button>
      </div>
      <p id="invite-status" hidden></p>
    </section>

    <section class="admin-toolbar">
      <label class="admin-search"><span>⌕</span><input id="student-search" type="search" placeholder="Пошук за ім’ям або поштою" /></label>
      <div class="admin-list-controls">
        <span id="student-count" class="admin-count"></span>
        <select id="student-filter" aria-label="Показувати">
          <option value="all">Усі</option>
          <option value="pending">Ще не заходили</option>
          <option value="registered">Уже заходили</option>
        </select>
        <select id="student-course" aria-label="Курс">
          <option value="all">Будь-який курс</option>
        </select>
        <select id="student-sort" aria-label="Порядок">
          <option value="new">Спершу нові</option>
          <option value="old">Спершу давні</option>
          <option value="email">За абеткою</option>
        </select>
      </div>
    </section>
    <p id="students-error" class="admin-alert error" hidden></p>
    <section id="students-list" class="admin-students-list" aria-live="polite"></section>
  </main>
</div>
<script type="module" src="js/pages/admin-manage-students.js?v=20261112-1"></script>
</body>
</html>
